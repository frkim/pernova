[project]
name = "pernova-backend"
version = "0.1.0"
description = "Governed synthetic supply-chain multiagent demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "PyJWT[crypto]==2.15.1",
  "openai==3.42.1",
  "azure-identity==1.27.0",
  "azure-monitor-opentelemetry==1.8.12",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[[tool.uv.index]]
name = "cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend.app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".."]

[tool.uv]
package = false
