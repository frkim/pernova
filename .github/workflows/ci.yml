name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
          registry-url: https://packagefeedproxy.microsoft.io/npm/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install protected package dependencies
        env:
          PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
          UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
        run: |
          python -m pip install uv==0.11.6
          npm ci
          npm run setup
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Lint Azure infrastructure (no deployment)
        run: az bicep lint --file infra/main.bicep
      - name: Compile Azure infrastructure (no deployment)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Install browser runtime
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
